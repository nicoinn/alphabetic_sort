name: CI

on:
  push:
    branches: ["main", "claude/**", "feature/**", "fix/**"]
  pull_request:
    branches: ["main"]
  workflow_call:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Cancel in-progress runs on the same branch/PR when a new push arrives
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------------------
  # Lint & type-check
  # -------------------------------------------------------------------------
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install linting tools
        run: pip install ruff mypy

      - name: ruff — lint
        run: ruff check alphabetic_sort/ tests/

      - name: ruff — format check
        run: ruff format --check alphabetic_sort/ tests/

      - name: mypy — type check
        run: mypy alphabetic_sort/

  # -------------------------------------------------------------------------
  # Test matrix across supported Python versions
  # -------------------------------------------------------------------------
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Upgrade build tools first — avoids docopt/setuptools build failure
      - name: Upgrade pip and setuptools
        run: pip install --upgrade pip setuptools wheel

      - name: Install package with dev extras
        run: pip install -e ".[dev]"

      - name: Run tests with coverage
        run: |
          pytest -v \
            --cov=alphabetic_sort \
            --cov-report=term-missing \
            --cov-report=xml

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          fail_ci_if_error: false

  # -------------------------------------------------------------------------
  # Build wheel + sdist and verify with twine
  # Runs after lint + test pass; artifacts are reused by the release workflow
  # -------------------------------------------------------------------------
  build:
    name: Build & verify distribution
    runs-on: ubuntu-latest
    needs: [lint, test]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Upgrade pip and build tools
        run: pip install --upgrade pip setuptools wheel build twine

      - name: Build wheel and sdist
        run: python -m build

      - name: Verify distributions with twine
        run: twine check --strict dist/*

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 7
