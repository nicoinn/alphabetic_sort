name: Release

# Triggered by a version tag: git tag v0.2.0 && git push --tags
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+.post[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+rc[0-9]+"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Minimal default permissions; extended per-job as needed
permissions:
  contents: read

jobs:
  # -------------------------------------------------------------------------
  # Run the full CI suite first — never publish a broken release
  # -------------------------------------------------------------------------
  ci:
    name: Run CI checks
    uses: ./.github/workflows/ci.yml

  # -------------------------------------------------------------------------
  # Build wheel + sdist
  # -------------------------------------------------------------------------
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Upgrade pip and build tools
        run: pip install --upgrade pip setuptools wheel build twine

      - name: Build wheel and sdist
        run: python -m build

      - name: Verify distributions
        run: twine check --strict dist/*

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  # -------------------------------------------------------------------------
  # Publish to TestPyPI first (smoke-test the upload pipeline)
  # Requires a "testpypi" GitHub Environment with OIDC trusted publishing
  # configured at https://test.pypi.org/manage/account/publishing/
  # -------------------------------------------------------------------------
  publish-testpypi:
    name: Publish to TestPyPI
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: testpypi
      url: https://test.pypi.org/p/alphabetic-sort
    permissions:
      id-token: write  # required for OIDC trusted publishing

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  # -------------------------------------------------------------------------
  # Publish to PyPI — only after TestPyPI succeeds
  # Requires a "pypi" GitHub Environment with OIDC trusted publishing
  # configured at https://pypi.org/manage/account/publishing/
  # -------------------------------------------------------------------------
  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: publish-testpypi
    environment:
      name: pypi
      url: https://pypi.org/p/alphabetic-sort
    permissions:
      id-token: write  # required for OIDC trusted publishing

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  # -------------------------------------------------------------------------
  # Create a GitHub Release with the distribution files attached
  # -------------------------------------------------------------------------
  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: publish-pypi
    permissions:
      contents: write  # to create releases and upload assets

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
