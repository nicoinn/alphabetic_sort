version: 2
updates:
  # Keep GitHub Actions versions current
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "ci"

  # Keep Python dependencies current
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "deps"
    groups:
      # Dev/test tools bundled into a single PR
      dev-tools:
        patterns:
          - "pytest*"
          - "ruff"
          - "mypy"
          - "httpx"
          - "build"
          - "twine"
