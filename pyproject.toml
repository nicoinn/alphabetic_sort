[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alphabetic_sort"
version = "0.1.0"
description = "Sort numbers by the alphabetical order of their word representations in a given language"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = [
    "num2words>=0.5.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-cov>=4",
    "httpx>=0.27",
]
webui = [
    "fastapi[standard]>=0.115",
    "jinja2>=3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["alphabetic_sort*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
